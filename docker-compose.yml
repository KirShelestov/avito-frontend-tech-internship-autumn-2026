# dev-окружение: бэкенд и фронтенд с hot-reload.
# Порты 3000 и 5173 на хосте должны быть свободны.

services:
  server:
    build: ./server
    container_name: bookroom-server
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: development
      CORS_ORIGINS: http://localhost:5173
      ENABLE_TEST_RESET: "true"
      # CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: npm run dev

  client:
    build: ./client
    container_name: bookroom-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000/api/v1/ws
      VITE_USE_MSW: "false"
      # CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - server

volumes:
  server_node_modules:
  client_node_modules:
